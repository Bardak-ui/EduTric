name: Django CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort autoflake python-decouple
    - name: Lint with flake8
      run: |
        flake8 apps EduTric --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 apps EduTric --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - name: Format with black
      run: black --check --diff apps EduTric
    - name: Check imports with isort
      run: isort --check-only --diff apps EduTric
    - name: Run tests
      run: |
        python manage.py check
        python manage.py test --verbosity=2
      env:
        DEBUG: True
        SECRET_KEY: test-secret-key
        ALLOWED_HOSTS: localhost,127.0.0.1