{% extends "base.html" %}
{% block content %}
<div class="semester-card" style="max-width: 500px; margin: 50px auto;">
    <h2 style="color: #fff;">Редактировать оценку</h2>
    
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="color: #fff;">Значение:</label>
            <select name="grade" class="group-select" style="width: 100%;">
                <option value="5" {% if grade_obj.grade == "5" %}selected{% endif %}>5</option>
                <option value="4" {% if grade_obj.grade == "4" %}selected{% endif %}>4</option>
                <option value="3" {% if grade_obj.grade == "3" %}selected{% endif %}>3</option>
                <option value="2" {% if grade_obj.grade == "2" %}selected{% endif %}>2</option>
                <option value="Н" {% if grade_obj.grade == "Н" %}selected{% endif %}>Н</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="submit" name="delete" class="btn btn-danger" 
                    onclick="return confirm('Вы уверены, что хотите удалить оценку?')">Удалить</button>
            <a href="{% url 'journal:group_info' group_id %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
