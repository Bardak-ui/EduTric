{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <title>Добро пожаловать на "госСПО"</title>
</head>
<body>
    <div class="container">
        <form method="POST">
            <h1>Добро пожаловать!</h1>
            {% csrf_token %}
            {{ user_input }}
            {{ form.as_p }}
            <button type="submit">Войти</button>
            <a href="{% url 'register' %}">Нет аккаунта?</a>
        </form>
    </div>
</body>
</html>
