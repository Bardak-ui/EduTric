{% extends "base.html" %}
    
{% block title %}Часто задаваемые вопросы{% endblock %}

{% block content %}
    <h1>Часто задаваемые вопросы</h1>
    {% for faq in faqs %}
        <details>
            <summary>{{ faq.question }}</summary>
            <p>{{ faq.answer }}</p>
        </details>
    {% endfor %}
{% endblock %}
