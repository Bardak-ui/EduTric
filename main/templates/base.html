{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>{% block title %}Навигация{% endblock %}</title>
</head>
<body>
    <div class="content">     
        <div class="header">
            <div class="icon">
                <a href="http://www.topcollege.ru/"> <img style="width: 90px; height: 90px;" src="{% static '/media/shrkt.png' %}"></a>
                <a href="https://shakhty.donland.ru/"> <img style="width: 80px; height: 80px;" src="{% static '/media/shackty.png' %}"></a>
            </div>
            <div class="searche">
                <input class="search" type="text" id="search" style="text-align: center; font-size: 30px;" placeholder="Поиск по сайту">
                
            </div>
        </div>
        <div class="left_panel">
            <div class="avatar">
                {% if user.profile_user.avatar %}
                    <a href="{% url 'profile' %}">
                        <div class="avatar-wrapper">
                            <img src="{{ user.profile_user.avatar.url }}" alt="Аватар" class="avatar">
                        </div>
                    </a>
                {% else %}
                    <a href="{% url 'profile' %}">
                        <img src="{% static 'media/no_avatar.jpeg' %}" alt="Аватар" class="avatar">
                    </a>
                {% endif %}
            </div>
            <nav>
                <a href="{% url 'home' %}"><img style="width: 80px; height: 80px;" src="{% static '/media/home.png' %}"></a>
                <a href="{% url 'schedule' %}"><img src="{% static '/media/schedule.png' %}"></a>
                <a href="{% url 'ads' %}"><img src="{% static '/media/ads.png' %}"></a>
                <a href="{% url 'pay' %}"><img style="width: 100px; height: 90px;" src="{% static '/media/pay.png' %}"></a>
                <br><br><br><br><br><br><br><br><br><br><br>
                <a href="{% url 'search_user' %}"><img src="{% static '/media/searche.png' %}"></a>
                <a href="{% url 'FAQ_LIST' %}"><img src="{% static '/media/faq.png' %}"></a>
            </nav>
        </div>
    </div>
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
