{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>{% block title %}Навигация{% endblock %}</title>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="avatar">
                {% if user.profile_user.avatar %}
                    <a href="{% url 'profile' %}">
                        <img src="{{ user.profile_user.avatar.url }}" alt="Аватар" class="avatar">
                    </a>
                {% else %}
                    <a href="{% url 'profile' %}">
                        <img src="{% static 'media/no_avatar.jpeg' %}" alt="Аватар" class="avatar">
                    </a>
                {% endif %}
            </div>
            <div class="icon">
                <a href="http://www.topcollege.ru/"><img src="{% static '/media/shrkt.png' %}" alt="Логотип 1"></a>
                <a href="https://shakhty.donland.ru/"><img src="{% static '/media/shackty.png' %}" alt="Логотип 2"></a>
            </div>
            <div class="searche">
                <a href="{% url 'search_user' %}"><img style="width: 45px; height: 45px;" src="{% static '/media/searche.png' %}" >
                </a>
                <input class="search" type="text" id="search" placeholder="Поиск студента по фамилии">
                
            </div>
        </div>

        <!-- Левая панель -->
        <div class="left_panel">
            <nav>
                <a href="{% url 'schedule' %}"><img src="{% static '/media/schedule.png' %}" alt="Расписание"></a>
                <a href="{% url 'ads' %}"><img src="{% static '/media/ads.png' %}" alt="Объявления"></a>
                <a href="{% url 'pay' %}"><img src="{% static '/media/pay.png' %}" alt="Оплата"></a>
                <a href="{% url 'search_user' %}"><img src="{% static '/media/searche.png' %}" alt="Поиск"></a>
                <a href="{% url 'FAQ_LIST' %}"><img src="{% static '/media/faq.png' %}" alt="FAQ"></a>
            </nav>
        </div>

        <!-- Основной контент -->
        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
