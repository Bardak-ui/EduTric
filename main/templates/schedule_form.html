{% extends "base.html" %}
{% load static %}
{% block title %}Расписание занятий{% endblock %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'shedule_form.css' %}"> <!-- Подключение стилей -->
</head>
    <h2>Добавить занятие в расписание</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <br>
    <form method="get" action="{% url 'schedule' %}">
        <button type="submit">Вернуться к расписанию</button>
    </form>
{% endblock %}
